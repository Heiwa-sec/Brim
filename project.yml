name: Brim
options:
  bundleIdPrefix: dev.brim
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CTGDR36LFJ
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Brim:
    type: application
    platform: macOS
    sources:
      - Brim
      - path: Vendor/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      # Bundled for the Perl script to dlopen; deliberately not linked.
      - target: MediaRemoteAdapter
        link: false
        embed: true
    info:
      path: Brim/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Brim
        NSPrincipalClass: NSApplication
        NSBluetoothAlwaysUsageDescription: Brim shows connected Bluetooth devices and their battery levels in the island.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brim.Brim
        GENERATE_INFOPLIST_FILE: NO
  # Vendored BSD-3 framework (ungive/mediaremote-adapter), unmodified. Symbols must stay visible: Perl calls into it.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/mediaremote-adapter/src
        excludes: ["test/**", "adapter/test.m"] # the `test` command is unused: it spawns a fake player
      - path: Vendor/mediaremote-adapter/include
        headers: [{path: MediaRemoteAdapter.h, visibility: public}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brim.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: -fvisibility=default
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/mediaremote-adapter/src", "$(SRCROOT)/Vendor/mediaremote-adapter/include"]
        OTHER_LDFLAGS: ["-framework", "Foundation", "-framework", "AppKit", "-framework", "UniformTypeIdentifiers"]
  # Compiles pure-logic files directly, so tests never launch the app.
  BrimTests:
    type: bundle.unit-test
    platform: macOS
    sources: [BrimTests, Brim/Island/NotchGeometry.swift, Brim/Modules/NowPlaying/NowPlayingInfo.swift, Brim/Modules/Lyrics/LRC.swift, Brim/Modules/Lyrics/ArtworkPalette.swift, Brim/Modules/Charging/PowerInfo.swift, Brim/Modules/Bluetooth/BluetoothBattery.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.brim.BrimTests
  # Throwaway: answers "can a window render over the lock screen on this macOS?" Deleted after integration.
  LockSpike:
    type: application
    platform: macOS
    sources: [LockSpike]
    info:
      path: LockSpike/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: LockSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brim.LockSpike
        GENERATE_INFOPLIST_FILE: NO
